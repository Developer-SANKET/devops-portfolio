kind = "web"
previewPath = "/"
title = "DevOps Portfolio"
version = "1.0.0"
id = "artifacts/devops-portfolio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24483

[services.development]
run = "pnpm --filter @workspace/devops-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devops-portfolio", "run", "build" ]
publicDir = "artifacts/devops-portfolio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24483"
BASE_PATH = "/"
